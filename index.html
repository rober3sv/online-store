<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Free E-Commerce Store</title>
    <!-- Simple CSS for Styling -->
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
        }
        header {
            background-color: #1a1a24;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .cart-btn {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }
        .product-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
        }
        .product-card img {
            max-width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 4px;
        }
        .buy-btn {
            background-color: #2ed573;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .buy-btn:hover {
            background-color: #26af5f;
        }
    </style>
</head>
<body>

    <!-- Header Section with Shopping Cart -->
    <header>
        <h1>Engineered Goods</h1>
        <!-- This button triggers the shopping cart sidebar slide-out -->
        <button class="snipcart-checkout cart-btn">
            View Cart (<span class="snipcart-items-count">0</span>)
        </button>
    </header>

    <div class="container">
        <h2>Our Products</h2>
        <div class="product-grid">

            <!-- PRODUCT 1 -->
            <div class="product-card">
                <img src="https://via.placeholder.com/300" alt="Product One">
                <h3>Precision Machined Widget</h3>
                <p>High-quality aluminum component designed to exact tolerances.</p>
                <p><strong>$45.00</strong></p>
                <!-- Snipcart Buy Button Attributes -->
                <button class="snipcart-add-item buy-btn"
                    data-item-id="widget-01"
                    data-item-name="Precision Machined Widget"
                    data-item-price="45.00"
                    data-item-url="/"
                    data-item-description="High-quality aluminum component designed to exact tolerances.">
                    Add to Cart
                </button>
            </div>

            <!-- PRODUCT 2 -->
            <div class="product-card">
                <img src="https://via.placeholder.com/300" alt="Product Two">
                <h3>Custom Custom Assembly Fixture</h3>

                <p><strong>$120.00</strong></p>
                <!-- Snipcart Buy Button Attributes -->
                <button class="snipcart-add-item buy-btn"

                    data-item-price="120.00"
                    data-item-url="/"
                    data-item-description="Heavy-duty alignment tooling fixture for bench manufacturing.">
                    Add to Cart
                </button>
            </div>

        </div>
    </div>
